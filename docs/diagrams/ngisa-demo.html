<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NGISA demo frames</title>
<!--
  Source of docs/assets/ngisa-demo.gif (and ngisa-demo.vi.gif).
  An illustrative mock, not a recording. Open with ?step=N&lang=en|vi to see one frame.
  Without ?step it plays the whole loop in the browser. The host page can send
  {type:"ngisa-demo", action:"pause"|"play"} with postMessage. With prefers-reduced-motion
  it shows the last frame and waits for "play".
  Regenerate the GIFs with docs/diagrams/render-demo-gif.sh.
-->
<style>
:root{
  --bg:#0d1117; --win:#141a24; --bar:#1c2330; --line:#2a3140; --fg:#d6dde8; --muted:#8b95a7;
  --gate:#9d8cff; --agent:#3cc4b2; --human:#ff6b5f; --ok:#4cc68a; --warn:#e7b93e;
  --mono:Menlo, "SF Mono", ui-monospace, Consolas, monospace;
  --sans:-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;width:960px;height:540px;background:var(--bg);overflow:hidden;font-family:var(--sans)}
.win{position:absolute;left:20px;top:16px;width:920px;height:456px;background:var(--win);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;height:30px;padding:0 12px;background:var(--bar);font:12px var(--mono);color:var(--muted)}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:#4a5363;display:block}
.tabs{display:flex;gap:2px;padding:6px 8px 0;background:#171d28;font:12px var(--mono)}
.tabs span{padding:5px 14px;border-radius:6px 6px 0 0;color:#8892a3}
.tabs .on{background:var(--win);color:#fff}
.body{display:grid;grid-template-columns:45fr 55fr;gap:2px;background:var(--line);flex:1;min-height:0}
.ngisa{background:var(--win);padding:12px 14px;font:13px/1.6 var(--mono);color:#b9c3d3;overflow:hidden}
.who{font:600 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--gate);margin-bottom:8px}
.you{color:#fff}.you::before{content:"> ";color:var(--muted)}
.cl::before{content:"\25CF  ";color:var(--gate)}
.hl{color:var(--human);font-weight:700}
.ok{color:var(--ok)}
.stack{display:grid;grid-template-rows:repeat(2,1fr);gap:2px;background:var(--line)}
.pane{background:var(--win);padding:9px 12px;font:12px/1.5 var(--mono);color:#b9c3d3;display:flex;flex-direction:column;gap:3px;min-height:0;overflow:hidden}
.pane.empty{align-items:center;justify-content:center;color:#3b4456}
.ph{display:flex;align-items:center;gap:8px;color:#fff;font-weight:600}
.st{font:600 10px var(--sans);padding:1px 8px;border-radius:99px;color:#10141b}
.st.w{background:var(--agent);color:#10141b}.st.d{background:var(--ok)}.st.n{background:var(--warn)}
.dim{color:var(--muted)}
.cap{position:absolute;left:20px;right:20px;top:482px;height:44px;display:flex;align-items:center;gap:12px;color:#fff;font-size:17px;font-weight:600}
.cap .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--gate);color:#10141b;display:flex;align-items:center;justify-content:center;font-size:14px}
.cap.human .n{background:var(--human);color:#10141b}
.cap small{margin-left:auto;font-weight:400;font-size:12px;color:var(--muted)}

/* Embed mode (?embed=1): fluid layout for the website, sized by postMessage. Frames for the GIFs never use it. */
html.emb,html.emb body{width:auto;height:auto;overflow:visible}
html.emb .win{position:static;width:auto;height:auto;border:0;border-radius:0}
html.emb .cap{position:static;height:auto;padding:14px 18px}
html.emb .body{min-height:320px}
html.emb .st{font-size:11px}
html.emb .pane{font-size:12.5px}
@media (max-width:640px){
  html.emb .body{grid-template-columns:1fr;min-height:0}
  html.emb .ngisa{min-height:290px}
  html.emb .stack{grid-template-rows:repeat(2,minmax(84px,auto))}
  html.emb .cap{font-size:15px}
}

.cur{display:inline-block;width:.55em;height:1.05em;background:var(--termfg);vertical-align:-.15em;margin-left:2px}
.ngisa .cl .hl{text-shadow:0 0 calc(var(--pulse,0) * 12px) var(--human)}
.cap .ct{display:inline-block}
.cap .prog{position:absolute;left:0;bottom:0;height:2px;background:var(--gate);opacity:.8}
html.emb{overflow:hidden}
html.emb .cap{position:relative;top:auto;left:auto;right:auto}
</style>
</head>
<body>
<div class="win">
  <div class="bar"><span class="dots"><i></i><i></i><i></i></span>WezTerm</div>
  <div class="tabs"><span class="on">shelfie</span><span>atlas-api</span></div>
  <div class="body">
    <div class="ngisa" id="ngisa"></div>
    <div class="stack" id="stack"></div>
  </div>
</div>
<div class="cap" id="cap"></div>

<script>
const T = {
  en: {
    task: "add offline mode to shelfie",
    plan: "Plan: 2 tasks (cache, sync). <span class=hl>Approve?</span>",
    go: "go",
    spawned: "Spawned cache, sync",
    cacheOk: "cache gate-check <span class=ok>ok</span>",
    syncOk: "sync gate-check <span class=ok>ok</span>",
    merged: "Merged cache, sync into a feature branch",
    done: "Draft PR ready. <span class=hl>Your merge.</span>",
    working: "Working", done_: "Done",
    wt: "own git worktree",
    tests: "write failing test, make it pass",
    gateRun: "./tool/ci_local.sh ...",
    gateOk: "./tool/ci_local.sh <span class=ok>exit 0</span>",
    caps: [
      "You give NGISA a task",
      "NGISA plans and splits it",
      "You approve the plan",
      "Workers start, each in its own git worktree",
      "Each worker must pass the repo's tool/ci_local.sh",
      "NGISA runs gate-check: gate files untouched",
      "Clean branches merge into a feature branch",
      "ci_local.sh runs again, draft PR ready",
      "Only you merge to main"
    ],
    note: "illustrative"
  },
  vi: {
    task: "thêm chế độ offline cho shelfie",
    plan: "Plan: 2 task (cache, sync). <span class=hl>Duyệt?</span>",
    go: "go",
    spawned: "Đã tạo agent cache, sync",
    cacheOk: "cache gate-check <span class=ok>ok</span>",
    syncOk: "sync gate-check <span class=ok>ok</span>",
    merged: "Đã gộp cache, sync vào nhánh feature",
    done: "Draft PR sẵn sàng. <span class=hl>Bạn merge.</span>",
    working: "Đang chạy", done_: "Xong",
    wt: "git worktree riêng",
    tests: "viết test fail, làm cho pass",
    gateRun: "./tool/ci_local.sh ...",
    gateOk: "./tool/ci_local.sh <span class=ok>exit 0</span>",
    caps: [
      "Bạn giao việc cho NGISA",
      "NGISA lên plan và chia task",
      "Bạn duyệt plan",
      "Worker khởi động, mỗi worker một git worktree",
      "Mỗi worker phải qua tool/ci_local.sh của repo",
      "NGISA chạy gate-check: file gate không bị đụng",
      "Nhánh sạch được gộp vào nhánh feature",
      "ci_local.sh chạy lại, draft PR sẵn sàng",
      "Chỉ bạn được merge vào main"
    ],
    note: "minh họa"
  }
};

// ms each step stays on screen. Used by the loop and by render-demo-gif.sh.
const DURATIONS = [1600, 1800, 1300, 2000, 2200, 2200, 2200, 2200, 3600];

// ---- time-driven engine: draw(t) paints the whole scene at t ms; the loop and the GIF both call it ----
const STARTS = DURATIONS.reduce((acc, d, i) => (acc.push(i ? acc[i-1] + DURATIONS[i-1] : 0), acc), []);
const TOTAL = DURATIONS.reduce((a, b) => a + b, 0);
const clamp01 = x => Math.min(1, Math.max(0, x));
const ease = x => 1 - Math.pow(1 - clamp01(x), 3);
const stepAt = t => { let s = 0; for (let i = 0; i < STARTS.length; i++) if (t >= STARTS[i]) s = i; return s; };
const textLen = html => html.replace(/<[^>]*>/g, "").length;

// keep the first n visible characters of an html string, closing any open tags
function clip(html, n){
  let out = "", count = 0, stack = [], i = 0;
  while(i < html.length){
    if(html[i] === "<"){
      const j = html.indexOf(">", i), tag = html.slice(i, j + 1);
      out += tag;
      if(tag[1] === "/") stack.pop(); else stack.push(tag.match(/^<(\w+)/)[1]);
      i = j + 1; continue;
    }
    if(count >= n) break;
    out += html[i]; count++; i++;
  }
  while(stack.length) out += `</${stack.pop()}>`;
  return out;
}

// item: {id, at, html, rate} - rate ms per character (typed), 0 = fade and rise in
function itemState(it, t){
  if(t < it.at) return null;
  const len = textLen(it.html);
  if(it.rate){
    const n = Math.min(len, Math.floor((t - it.at) / it.rate) + 1);
    return {html: clip(it.html, n), op: 1, ty: 0, typing: n < len, end: it.at + len * it.rate};
  }
  const p = ease((t - it.at) / 240);
  return {html: it.html, op: p, ty: (1 - p) * 6, typing: false, end: it.at};
}

function model(lang){
  const t = T[lang], dim = s => `<span class=dim>${s}</span>`;
  const ngisa = [
    {id:"task",   cls:"you", at:250,   rate:38, html:t.task},
    {id:"plan",   cls:"cl",  at:1750,  rate:16, html:t.plan},
    {id:"go",     cls:"you", at:3500,  rate:90, html:t.go},
    {id:"spawn",  cls:"cl",  at:4800,  rate:0,  html:t.spawned},
    {id:"cacheOk",cls:"cl",  at:9500,  rate:0,  html:t.cacheOk},
    {id:"syncOk", cls:"cl",  at:10300, rate:0,  html:t.syncOk},
    {id:"merged", cls:"cl",  at:11300, rate:16, html:t.merged},
    {id:"ci",     cls:"cl",  at:13500, rate:0,  html:t.gateOk},
    {id:"done",   cls:"cl",  at:15700, rate:14, html:t.done}
  ];
  const slot = (id, list) => list.map((e, i) => Object.assign({id: id + i}, e));
  const panes = [
    {name:"shelfie-cache", at:4800,
     status:[{at:4800, txt:t.working, c:"w"}, {at:9300, txt:t.done_, c:"d"}],
     l1: slot("c1", [{at:4950, rate:0, html:dim(t.wt)}, {at:9300, rate:30, html:t.gateOk}]),
     l2: slot("c2", [{at:5200, rate:22, html:t.tests}, {at:6900, rate:30, html:t.gateRun}, {at:9300, rate:0, html:""}])},
    {name:"shelfie-sync", at:4800,
     status:[{at:4800, txt:t.working, c:"w"}, {at:10100, txt:t.done_, c:"d"}],
     l1: slot("s1", [{at:4950, rate:0, html:dim(t.wt)}, {at:10100, rate:30, html:t.gateOk}]),
     l2: slot("s2", [{at:5200, rate:22, html:t.tests}, {at:6900, rate:30, html:t.gateRun}, {at:10100, rate:0, html:""}])}
  ];
  return {ngisa, panes};
}

const MODELS = {};
function draw(t, lang){
  const tt = T[lang], M = MODELS[lang] || (MODELS[lang] = model(lang));
  const step = stepAt(t);
  // gentle fade of the whole scene at the end of the loop, so the GIF loops without a jump
  const scene = 1 - ease((t - (TOTAL - 500)) / 500);
  document.querySelector(".body").style.opacity = scene;

  // cursor goes to the most recently started typed item, for a moment after it finishes
  let cur = null, curAt = -1;
  const typed = [];
  M.ngisa.forEach(it => typed.push(it));
  M.panes.forEach(p => [...p.l1, ...p.l2].forEach(it => typed.push(it)));
  typed.forEach(it => { if(it.rate && t >= it.at && t <= it.at + textLen(it.html) * it.rate + 700 && it.at >= curAt){ cur = it.id; curAt = it.at; } });
  const blink = Math.floor(t / 420) % 2 === 0;
  const withCursor = (it, st) => (it.id === cur && (st.typing || blink)) ? st.html + `<span class="cur"></span>` : st.html;

  let n = `<div class="who">NGISA - shelfie - Opus</div>`;
  M.ngisa.forEach(it => {
    const st = itemState(it, t);
    if(!st) return;
    n += `<div class="${it.cls}" style="opacity:${st.op.toFixed(3)};transform:translateY(${st.ty.toFixed(2)}px)">${withCursor(it, st)}</div>`;
  });
  const ngisaEl = document.getElementById("ngisa");
  const doneIt = M.ngisa[M.ngisa.length - 1];
  const pulse = t > doneIt.at + textLen(doneIt.html) * doneIt.rate + 100 ? 0.5 + 0.5 * Math.sin((t - doneIt.at) / 260) : 0;
  ngisaEl.style.setProperty("--pulse", pulse.toFixed(3));
  ngisaEl.innerHTML = n;

  const pick = (list) => { let best = null; list.forEach(e => { if(t >= e.at) best = e; }); return best; };
  const line = (list) => {
    const e = pick(list); if(!e) return "";
    const st = itemState(e, t);
    return st.html === "" && !e.rate ? "" : `<div style="opacity:${st.op.toFixed(3)};transform:translateY(${st.ty.toFixed(2)}px)">${withCursor(e, st)}</div>`;
  };
  document.getElementById("stack").innerHTML = M.panes.map(p => {
    if(t < p.at) return `<div class="pane empty">-</div>`;
    const op = ease((t - p.at) / 260);
    const s = pick(p.status), sp = ease((t - s.at) / 220);
    return `<div class="pane" style="opacity:${op.toFixed(3)}"><div class="ph">${p.name}<span class="st ${s.c}" style="opacity:${sp.toFixed(3)};transform:scale(${(0.9 + 0.1 * sp).toFixed(3)})">${s.txt}</span></div>${line(p.l1)}${line(p.l2)}</div>`;
  }).join("");

  const cap = document.getElementById("cap");
  const cp = ease((t - STARTS[step]) / 280);
  cap.className = "cap" + (step === 8 ? " human" : "");
  cap.innerHTML = `<span class="n">${step + 1}</span><span class="ct" style="opacity:${cp.toFixed(3)};transform:translateY(${((1 - cp) * 8).toFixed(2)}px)">${tt.caps[step]}</span><small>${tt.note}</small><i class="prog" style="width:${(t / TOTAL * 100).toFixed(2)}%"></i>`;
  return step;
}

const q = new URLSearchParams(location.search);
const lang = q.get("lang") === "vi" ? "vi" : "en";
document.documentElement.lang = lang;
const embed = q.has("embed");
if(embed){
  document.documentElement.classList.add("emb");
  const post = () => parent.postMessage({type:"ngisa-demo-size", h:document.body.getBoundingClientRect().height}, "*");
  new ResizeObserver(post).observe(document.body);
  addEventListener("load", post);
}
let lastStep = -1;
function show(t){
  const s = draw(t, lang);
  if(embed && s !== lastStep){ lastStep = s; parent.postMessage({type:"ngisa-demo-step", step:s}, "*"); }
}
if(q.has("t")){
  show(Number(q.get("t")));                                   // one frame at t ms (GIF renderer)
} else if(q.has("step")){
  const s = Number(q.get("step"));                            // settled end of a step
  show(Math.min(TOTAL - 1, STARTS[s] + DURATIONS[s] - 1));
} else {
  let offset = 0, startedAt = performance.now(), playing = !matchMedia("(prefers-reduced-motion: reduce)").matches;
  const frame = now => {
    if(playing) show((now - startedAt + offset) % TOTAL);
    requestAnimationFrame(frame);
  };
  if(!playing) show(STARTS[STARTS.length - 1] + 1400);       // reduced motion: settled last frame until "play"
  requestAnimationFrame(frame);
  addEventListener("message", e => {
    const m = e.data;
    if(!m || m.type !== "ngisa-demo") return;
    if(m.action === "pause" && playing){ offset += performance.now() - startedAt; playing = false; }
    else if(m.action === "play" && !playing){ startedAt = performance.now(); playing = true; }
  });
}
</script>
</body>
</html>
